name: deployforge

x-app-environment: &app-environment
  DEPLOYFORGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-deployforge}:${POSTGRES_PASSWORD:-deployforge}@postgres/${POSTGRES_DB:-deployforge}
  DEPLOYFORGE_SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-deployforge}:${POSTGRES_PASSWORD:-deployforge}@postgres/${POSTGRES_DB:-deployforge}
  DEPLOYFORGE_REDIS_URL: redis://redis:6379/0
  DEPLOYFORGE_SECRET_KEY: ${DEPLOYFORGE_SECRET_KEY:-deployforge-local-development-key-change-me}
  DEPLOYFORGE_RUNTIME_NETWORK: deployforge-runtime
  DEPLOYFORGE_HTTP_PORT: ${DEPLOYFORGE_HTTP_PORT:-80}
  DEPLOYFORGE_LOG_LEVEL: ${DEPLOYFORGE_LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deployforge}
      POSTGRES_USER: ${POSTGRES_USER:-deployforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deployforge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - control
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    networks:
      - control
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *app-environment
    ports:
      - "127.0.0.1:${DEPLOYFORGE_API_PORT:-8000}:8000"
    networks:
      - control
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    user: root
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - worker
      - --beat
      - --loglevel=INFO
      - --concurrency=1
      - --hostname=worker@%h
      - --schedule=/tmp/celerybeat-schedule
    environment: *app-environment
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - control
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.celery_app:celery_app inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

  traefik:
    image: traefik:v3.7.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=deployforge-runtime
      - --entrypoints.web.address=:80
      - --log.level=${DEPLOYFORGE_TRAEFIK_LOG_LEVEL:-INFO}
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
      - --ping=true
      - --api.dashboard=false
    ports:
      - "127.0.0.1:${DEPLOYFORGE_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - runtime
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  control:
  runtime:
    name: deployforge-runtime
